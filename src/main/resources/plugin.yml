name: DSellSystem
version: 1.0.0
main: ca.l1cked.dsellsystem.DSellSystemPlugin
api-version: 1.21
depend: [Vault]
softdepend: [ProtocolLib, EzEconomy]
author: L1cked
description: Advanced selling plugin with multiplier progression system

permissions:
  dsellsystem.reload:
    description: Allows reloading the plugin configuration
    default: op

  dsellsystem.history.other:
    description: Allows viewing /sell history for other players
    default: op
  dsellsystem.setworth:
    description: Allows setting item prices with /setworth
    default: op

  dsellsystem.settings:
    description: Allows opening the settings menu
    default: op

  dsellsystem.resetworth:
    description: Allows clearing worth lore for players
    default: op
