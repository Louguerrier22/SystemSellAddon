database:
  type: "sqlite"
  sqlite:
    file: "data.db"
  mysql:
    host: "localhost"
    port: 3306
    database: "systemselladdon"
    username: "root"
    password: "password"
    use-ssl: false
    params: "allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8"

level-prices:
  mode: "formula"
  max-levels: 20
  formula:
    base: 25000
    growth: 1.6
    exponent: 1.0
    add-per-level: 0
    min: 0
    max: 640000000000
  # list mode example:
  # mode: "list"
  # list:
  #   - 25000
  #   - 150000
  #   - 500000
  list: []

settings:
  enabled: true

  base-multiplier: 1.0

  multiplier-increment: 0.1

  max-multiplier: 3.0

  worth-lore:
    enabled: true
    format: "&7Worth: &a$%price%"

# MayorSystem sell-perk definitions (loaded by MayorSystem on startup)
